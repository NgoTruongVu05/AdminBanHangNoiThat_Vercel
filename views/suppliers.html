<div class="toolbar">
  <input class="search" id="search" placeholder="Tìm theo mã, tên nhà cung cấp hoặc liên hệ...">
  <select id="supplier-filter">
    <option value="">Tất cả trạng thái</option>
  </select>
  <div class="spacer"></div>
  <button class="btn" id="add-btn"><span class="material-symbols-outlined" aria-hidden="true">add</span><span>Thêm nhà
      cung cấp</span></button>
</div>
<section class="view-card">
  <h2>Danh sách nhà cung cấp</h2>
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>Mã NCC</th>
          <th>Tên nhà cung cấp / công ty</th>
          <th>Địa chỉ</th>
          <th>Liên hệ</th>
          <th>Trạng thái</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody id="suppliers-body">
        
      </tbody>
    </table>
  </div>
</section>
