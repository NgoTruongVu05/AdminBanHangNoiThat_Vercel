<div class="toolbar">
  <input class="search" id="search" placeholder="Tìm theo mã hóa đơn hoặc tên khách hàng...">
  <select id="order-filter">
    <option value="">Tất cả trạng thái</option>
  </select>
  <div class="spacer"></div>
</div>
<section class="master-detail orders-layout">
  <div class="master-list view-card">
    <div class="list-heading"><h2>Danh sách hóa đơn bán hàng</h2><span id="orders-count"></span></div>
    <div class="table-wrap master-table-wrap">
      <table class="data-table master-table">
        <thead><tr><th>Mã HĐ</th><th>Khách hàng</th><th>Nhân viên</th><th>Ngày đặt</th><th>Ngày giao</th><th>Tổng tiền</th><th>Thành tiền</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
        <tbody id="orders-body"></tbody>
      </table>
    </div>
  </div>
  <section id="order-detail-panel" class="detail-panel view-card">
    <div class="detail-placeholder">
      <span class="material-symbols-outlined">receipt_long</span>
      <h2>Chọn một hóa đơn</h2>
      <p>Thông tin chi tiết sẽ hiển thị tại đây.</p>
    </div>
  </section>
</section>
