<div class="toolbar">
  <input class="search" id="search" placeholder="Tìm theo mã phiếu hoặc nhà cung cấp...">
  <select id="import-filter">
    <option value="">Tất cả trạng thái</option>
  </select>
  <div class="spacer"></div>
  <button class="btn" id="add-btn"><span class="material-symbols-outlined" aria-hidden="true">add</span><span>Tạo phiếu
      nhập</span></button>
</div>
<section class="view-card">
  <h2>Danh sách phiếu nhập kho</h2>
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>Mã phiếu</th>
          <th>Ngày nhập</th>
          <th>Nhà cung cấp</th>
          <th>Số mặt hàng</th>
          <th>Trạng thái</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody id="imports-body">
        
      </tbody>
    </table>
  </div>
</section>
