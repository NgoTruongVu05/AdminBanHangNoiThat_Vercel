<div class="toolbar">
  <input class="search" id="search" placeholder="Tìm theo mã phiếu hoặc nhà cung cấp...">
  <select id="import-filter">
    <option value="">Tất cả trạng thái</option>
  </select>
  <div class="spacer"></div>
  <button class="btn" id="add-btn"><span class="material-symbols-outlined" aria-hidden="true">add</span><span>Tạo phiếu
      nhập</span></button>
</div>
<section class="master-detail">
  <div class="master-list view-card">
    <h2>Danh sách phiếu nhập kho</h2>
    <div id="imports-body" class="master-list-items"></div>
  </div>
  <section id="import-detail-panel" class="detail-panel view-card">
    <div class="detail-placeholder">
      <span class="material-symbols-outlined">description</span>
      <h2>Chọn một phiếu nhập</h2>
      <p>Thông tin chi tiết sẽ hiển thị tại đây.</p>
    </div>
  </section>
</section>
