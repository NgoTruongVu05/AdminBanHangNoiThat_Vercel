    <option value="">Tất cả loại sản phẩm</option>
  </select>
  <div class="spacer"></div>
  <button class="btn" id="add-btn"><span class="material-symbols-outlined" aria-hidden="true">add</span><span>Thêm kiểu
      dáng</span></button>

          <th>Mã kiểu</th>

          <th>Thuộc loại sản phẩm</th>
          <th>Trạng thái</th>
          <th>Thao tác</th>

      <tbody id="styles-body">
        
      </tbody>
    </table>
