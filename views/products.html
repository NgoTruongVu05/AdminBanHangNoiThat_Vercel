<div class="toolbar">
  <input class="search" id="search" placeholder="Tìm theo mã hoặc tên sản phẩm...">
  <select id="product-filter">
    <option value="">Tất cả loại SP</option>
  </select>
  <div class="spacer"></div>
  <button class="btn" id="add-btn"><span class="material-symbols-outlined" aria-hidden="true">add</span><span>Thêm sản
      phẩm</span></button>
</div>
<section class="view-card">
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>
          <th>Mã SP</th>
          <th>Tên sản phẩm</th>
          <th>Phân loại</th>
          <th>Kiểu dáng</th>
          <th>Loại gỗ</th>
          <th>Đơn giá niêm yết</th>
          <th>Tồn kho</th>
          <th>Trạng thái</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody id="products-body"></tbody>
    </table>
  </div>
  <div class="footnote"><span>Hiển thị <b id="products-count"></b> sản phẩm</span></div>
</section>
